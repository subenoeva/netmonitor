name: release

# Pushing a tag like v2.1.0 builds the Windows installer and publishes it as a GitHub release.
# NetMonitor's updater (Ajustes → Actualizaciones) downloads the *-setup.exe from the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          gh release create "$env:GITHUB_REF_NAME" "$($setup.FullName)" --title "NetMonitor $env:GITHUB_REF_NAME" --generate-notes
