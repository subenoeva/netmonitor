[package]
name = "netmonitor"
version = "2.1.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
aes = "0.8"
base64 = "0.22"
dns-lookup = "4.0.2"
flate2 = "1.1.11"
md-5 = "0.10"
netdev = "0.47.0"
num-bigint = "0.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
ureq = "3.5.2"
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies.cbc]
version = "0.1"
features = ["std"]
